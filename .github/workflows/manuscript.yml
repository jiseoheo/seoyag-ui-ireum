# main에 저장될 때마다 장별 원고(manuscript/chapters/)와 한 권짜리 원고(manuscript/current.html)를 맞춘다.
# - 장별 파일만 바뀌었으면 current.html을 다시 만든다.
# - current.html만 바뀌었으면 장별 파일을 다시 나눈다.
# - 둘 다 바뀌었는데 서로 다르면 실패로 표시한다(사람이 확인).
name: manuscript-sync

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "manifest.json"
      - "scripts/manuscript.py"

permissions:
  contents: write

concurrency:
  group: manuscript-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync manuscript
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)
          parts=$(echo "$changed" | grep -c '^manuscript/chapters/' || true)
          book=$(echo "$changed" | grep -c '^manuscript/current.html$' || true)
          if [ "$parts" -gt 0 ] && [ "$book" -eq 0 ]; then
            python3 scripts/manuscript.py build
          elif [ "$book" -gt 0 ] && [ "$parts" -eq 0 ]; then
            python3 scripts/manuscript.py split
          fi
          python3 scripts/manuscript.py check

      - name: Commit synced files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "manuscript-sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manuscript
            git commit -m "Sync manuscript chapters and current.html"
            git push
          fi
